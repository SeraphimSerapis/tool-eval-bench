# Pre-commit hooks — run `pre-commit install` to activate.
# See https://pre-commit.com for more information.

repos:
  # ── Ruff: lint + format ─────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Pytest: required suite (pre-push only) ───────────────
  - repo: local
    hooks:
      - id: mypy-check
        name: mypy (package)
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest-check
        name: pytest (required suite)
        entry: .venv/bin/python -m pytest tests/ --ignore=tests/test_llama_benchy.py -m "not live" -x -q --tb=line --no-header --randomly-seed=104729
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
