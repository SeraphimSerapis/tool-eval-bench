# Pre-commit hooks — run `pre-commit install` to activate.
# See https://pre-commit.com for more information.

default_install_hook_types: [pre-commit, pre-push, post-checkout]

repos:
  # ── Safety nets: catch what a rushed commit adds by accident ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        # compare/git/ holds committed generator output; the hook would
        # fight the generator every time a sample is regenerated.
        exclude: ^compare/git/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^compare/git/

  # ── Ruff: lint + format ─────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Pytest: required suite (pre-push only) ───────────────
  - repo: local
    hooks:
      - id: mypy-check
        name: mypy (package)
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest-check
        name: pytest (required suite)
        entry: .venv/bin/python -m pytest tests/ --ignore=tests/test_llama_benchy.py -m "not live" -x -q --tb=line --no-header --randomly-seed=104729
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: link-worktree-venv
        name: link primary venv into Git worktrees
        entry: python scripts/link_worktree_venv.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [post-checkout]
