name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "OpenAI-compatible canary endpoint"
        required: true
        type: string
      model:
        description: "Optional model ID"
        required: false
        type: string

# Pushing twice to a PR should not run two full matrices. The default branch is
# excluded so main's history keeps a result for every commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Single-version jobs pin 3.13. The supported floor (3.11) and Windows are
# covered by test-extended on main.

jobs:
  # Ruff and mypy are version-independent — mypy is pinned to
  # python_version = "3.11" in pyproject regardless of the interpreter it runs
  # on — so running them once says everything running them per matrix entry
  # would. They use the locked toolchain rather than pre-commit's pinned
  # mirror, which is a minor version behind and would disagree on the margins.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.8'

      - name: Install from the committed lock
        run: uv sync --locked --extra dev --python 3.13

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  # The gating test run. One interpreter, with the perf extra installed so the
  # llama-benchy integration is covered here rather than in its own job.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags; a shallow clone would
          # make every CI build report an unattributable version.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.8'

      # The lock is what the Docker image and a `uv tool install` resolve to.
      # Installing from it here means CI tests the same versions users get, and
      # an upstream release cannot turn a green branch red with no repo change.
      - name: Install from the committed lock
        run: uv sync --locked --extra dev --extra perf --python 3.13

      - name: Pytest
        run: >
          uv run pytest --tb=short -q
          --ignore=tests/test_llama_benchy.py
          -m "not live"
          --randomly-seed=104729
          --cov=tool_eval_bench --cov-report=term-missing --cov-report=json
          --cov-fail-under=80

      - name: Critical module coverage
        run: uv run python scripts/check_module_coverage.py coverage.json

      # A separate invocation because llama_benchy.py is omitted from the
      # project's coverage config: it is unreachable without the perf extra, so
      # counting it in the main run would depress the floor for everyone. Its
      # own gate is stricter than the project's, and .coveragerc.perf is what
      # lifts the omission for this one step.
      - name: Test llama-benchy integration
        run: >
          uv run pytest --tb=short -q
          tests/test_llama_benchy.py tests/test_llama_benchy_redaction.py
          -m "not live" --randomly-seed=181081
          --cov=tool_eval_bench.runner.llama_benchy
          --cov-config=.coveragerc.perf --cov-report=term-missing --cov-fail-under=95

      - name: Upload coverage report
        # A reviewer cannot see what a pull request did to coverage without it.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ubuntu-py3.13
          path: coverage.json
          if-no-files-found: ignore
          retention-days: 14

  # Post-merge only. Windows has caught real product bugs here — filler seeded
  # from a clock that ticks every 15.6ms, durations measured with
  # time.monotonic(), a missing tzdata that changed TC-17's score — so it stays
  # in CI. It runs after merge rather than on every PR because those bugs were
  # found by running the suite at all, not by gating each change on it. 3.11 is
  # the supported floor and rides along.
  test-extended:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to PowerShell, where the quoting in the
        # pytest invocation below parses differently. One shell everywhere.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            random-seed: '130363'
          # storage/db.py resolves its path from Path.cwd() and runs SQLite in
          # WAL mode, and Windows opens files as cp1252 and refuses to delete
          # one that is still open. Those are the differences that bite.
          - os: windows-latest
            python-version: '3.12'
            random-seed: '199933'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.8'

      - name: Install from the committed lock
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      # No coverage gate. The keypress reader is POSIX-only and its tests skip
      # on Windows, so coverage there is structurally lower and not comparable
      # to the floors. What these runners are for is whether the tests pass.
      - name: Pytest
        run: >
          uv run pytest --tb=short -q
          --ignore=tests/test_llama_benchy.py
          -m "not live"
          --randomly-seed=${{ matrix.random-seed }}

  pre-commit:
    # The hooks are the local feedback loop; without this they rot silently and
    # only bite the next contributor who installs them.
    runs-on: ubuntu-latest
    env:
      # Ruff already ran in `lint`, from the locked version rather than the
      # mirror's pin. Running it twice per pull request only invites the two to
      # disagree.
      SKIP: ruff,ruff-format

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run hooks that do not need the project venv
        uses: pre-commit/action@v3.0.1
        with:
          # Every default-stage hook. The mypy and pytest hooks declare
          # `stages: [pre-push]` and need the project venv, so they skip here.
          extra_args: --all-files

  # Both halves of "does this ship": the image and the wheel. They were separate
  # jobs; nothing about them ran in parallel that mattered.
  packaging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags; a shallow clone would
          # make every CI build report an unattributable version.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build image
        run: docker build -t tool-eval-bench:ci .

      - name: Verify the committed dependency lock
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.10.8'
          uv lock --check

      - name: Smoke test container provenance and CLI entrypoint
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          version="$(docker run --rm tool-eval-bench:ci --version)"
          echo "$version"
          test "${version#*unknown}" = "$version"
          docker run --rm tool-eval-bench:ci --help
          docker run --rm --entrypoint sh tool-eval-bench:ci -c \
            'test "$(id -u)" != 0 && test ! -e /build/.git && test ! -e /app/.git && touch /app/data/image-write && touch /app/runs/image-write'
          mount_root="$(mktemp -d)"
          mkdir -p "$mount_root/data" "$mount_root/runs"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$mount_root/data:/app/data" \
            -v "$mount_root/runs:/app/runs" \
            --entrypoint sh tool-eval-bench:ci -c \
            'touch /app/data/mount-write && touch /app/runs/mount-write'
          test -f "$mount_root/data/mount-write"
          test -f "$mount_root/runs/mount-write"
          LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)" docker compose config --quiet
          worktree="$(mktemp -d)"
          rmdir "$worktree"
          git worktree add --detach "$worktree" HEAD
          docker build \
            --build-arg BUILD_VERSION="0.0.0+g$(git -C "$worktree" rev-parse --short HEAD)" \
            -t tool-eval-bench:worktree "$worktree"
          docker run --rm tool-eval-bench:worktree --version | grep -F '+g'

      - name: Build isolated wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/tool-eval-wheel-smoke
          /tmp/tool-eval-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/tool-eval-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/tool-eval-wheel-smoke/bin/python -m pip check

      - name: Smoke-test installed CLI and package data
        run: |
          /tmp/tool-eval-wheel-smoke/bin/tool-eval-bench --version
          /tmp/tool-eval-wheel-smoke/bin/tool-eval-bench --help
          for command in run probe bench spec-live plugin compare history leaderboard export resume; do
            /tmp/tool-eval-wheel-smoke/bin/tool-eval-bench "$command" --help >/dev/null
          done
          /tmp/tool-eval-wheel-smoke/bin/python - <<'PY'
          from importlib.resources import as_file, files

          from tool_eval_bench.evals.yaml_loader import load_yaml_scenarios

          resource = files("tool_eval_bench.evals.yaml_scenarios").joinpath("weather.yaml")
          assert resource.is_file(), "bundled weather.yaml is missing"
          with as_file(resource) as path:
              scenarios = load_yaml_scenarios(path.parent)
          assert any(scenario.id == "YAML-01" for scenario in scenarios)
          PY

  live-canary:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags; a shallow clone would
          # make every CI build report an unattributable version.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run deployment canary
        env:
          TOOL_EVAL_CANARY_BASE_URL: ${{ inputs.base_url }}
          TOOL_EVAL_CANARY_MODEL: ${{ inputs.model }}
          TOOL_EVAL_CANARY_API_KEY: ${{ secrets.TOOL_EVAL_CANARY_API_KEY }}
        run: pytest -q tests/test_live_canary.py -m live --tb=short
