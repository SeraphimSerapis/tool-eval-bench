name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "OpenAI-compatible canary endpoint"
        required: true
        type: string
      model:
        description: "Optional model ID"
        required: false
        type: string

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            random-seed: '104729'
          - python-version: '3.12'
            random-seed: '130363'
          - python-version: '3.13'
            random-seed: '155921'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags; a shallow clone would
          # make every CI build report an unattributable version.
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: >
          pytest --tb=short -q
          --ignore=tests/test_llama_benchy.py
          -m "not live"
          --randomly-seed=${{ matrix.random-seed }}
          --cov=tool_eval_bench --cov-report=term-missing --cov-report=json
          --cov-fail-under=80

      - name: Critical module coverage
        run: python scripts/check_module_coverage.py coverage.json

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags; a shallow clone would
          # make every CI build report an unattributable version.
          fetch-depth: 0

      - name: Build image
        run: docker build -t tool-eval-bench:ci .

      - name: Verify the committed dependency lock
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.10.8'
          uv lock --check

      - name: Smoke test container provenance and CLI entrypoint
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          version="$(docker run --rm tool-eval-bench:ci --version)"
          echo "$version"
          test "${version#*unknown}" = "$version"
          docker run --rm tool-eval-bench:ci --help
          docker run --rm --entrypoint sh tool-eval-bench:ci -c \
            'test "$(id -u)" != 0 && test ! -e /build/.git && test ! -e /app/.git && touch /app/data/image-write && touch /app/runs/image-write'
          mount_root="$(mktemp -d)"
          mkdir -p "$mount_root/data" "$mount_root/runs"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$mount_root/data:/app/data" \
            -v "$mount_root/runs:/app/runs" \
            --entrypoint sh tool-eval-bench:ci -c \
            'touch /app/data/mount-write && touch /app/runs/mount-write'
          test -f "$mount_root/data/mount-write"
          test -f "$mount_root/runs/mount-write"
          LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)" docker compose config --quiet
          worktree="$(mktemp -d)"
          rmdir "$worktree"
          git worktree add --detach "$worktree" HEAD
          docker build \
            --build-arg BUILD_VERSION="0.0.0+g$(git -C "$worktree" rev-parse --short HEAD)" \
            -t tool-eval-bench:worktree "$worktree"
          docker run --rm tool-eval-bench:worktree --version | grep -F '+g'

  optional-perf-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags; a shallow clone would
          # make every CI build report an unattributable version.
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install with optional performance dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,perf]'

      - name: Test llama-benchy integration
        run: >
          pytest --tb=short -q tests/test_llama_benchy.py
          -m "not live" --randomly-seed=181081
          --cov=tool_eval_bench.runner.llama_benchy
          --cov-config=/dev/null --cov-report=term-missing --cov-fail-under=95

  wheel-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags; a shallow clone would
          # make every CI build report an unattributable version.
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build isolated wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/tool-eval-wheel-smoke
          /tmp/tool-eval-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/tool-eval-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/tool-eval-wheel-smoke/bin/python -m pip check

      - name: Smoke-test installed CLI and package data
        run: |
          /tmp/tool-eval-wheel-smoke/bin/tool-eval-bench --version
          /tmp/tool-eval-wheel-smoke/bin/tool-eval-bench --help
          for command in run probe bench spec-live plugin compare history leaderboard export resume; do
            /tmp/tool-eval-wheel-smoke/bin/tool-eval-bench "$command" --help >/dev/null
          done
          /tmp/tool-eval-wheel-smoke/bin/python - <<'PY'
          from importlib.resources import as_file, files

          from tool_eval_bench.evals.yaml_loader import load_yaml_scenarios

          resource = files("tool_eval_bench.evals.yaml_scenarios").joinpath("weather.yaml")
          assert resource.is_file(), "bundled weather.yaml is missing"
          with as_file(resource) as path:
              scenarios = load_yaml_scenarios(path.parent)
          assert any(scenario.id == "YAML-01" for scenario in scenarios)
          PY

  live-canary:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags; a shallow clone would
          # make every CI build report an unattributable version.
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run deployment canary
        env:
          TOOL_EVAL_CANARY_BASE_URL: ${{ inputs.base_url }}
          TOOL_EVAL_CANARY_MODEL: ${{ inputs.model }}
          TOOL_EVAL_CANARY_API_KEY: ${{ secrets.TOOL_EVAL_CANARY_API_KEY }}
        run: pytest -q tests/test_live_canary.py -m live --tb=short
