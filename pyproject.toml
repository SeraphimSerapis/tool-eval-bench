[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-eval-bench"
# Derived from git via setuptools-scm so a build installed straight from a
# commit (`uv tool install git+…`) reports which commit produced it. A
# hardcoded version made every dev build look like the last release, which is
# how a machine can silently benchmark stale code.
dynamic = ["version"]
description = "Agentic tool-call benchmark for LLM serving stacks (vLLM, LiteLLM, llama.cpp)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "SeraphimSerapis" }]
keywords = ["llm", "benchmark", "tool-calling", "vllm", "evaluation", "agentic"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.0",
  "python-dotenv>=1.1.0",
  "pyyaml>=6.0",
  "rich>=14.0.0",
]

[project.optional-dependencies]
perf = [
  "llama-benchy>=0.4.0",
]
hf = [
  "datasets>=3.0.0",
]
dev = [
  "mypy>=1.15.0",
  "types-PyYAML>=6.0.12",
  "pytest>=8.4.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.1.0",
  "pytest-randomly>=3.16.0",
  "ruff>=0.12.0",
  "pre-commit>=4.0.0",
  "towncrier>=24.8.0",
]

[tool.towncrier]
# CHANGELOG.md is generated. Each change adds its own file under changelog.d/
# instead of editing the changelog directly, so two branches never touch the
# same lines and never conflict. `towncrier build` collapses them at release.
package = "tool_eval_bench"
package_dir = "src"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
# Matches the heading style used by every release below it. The leading "##"
# also tells towncrier to render category headings at "###".
title_format = "## [{version}] \u2014 {project_date}"
issue_format = "[#{issue}](https://github.com/SeraphimSerapis/tool-eval-bench/issues/{issue})"
# Entries are written as finished prose; leave them exactly as authored.
wrap = false

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.mypy]
python_version = "3.11"
files = ["src/tool_eval_bench"]
# Generated by setuptools-scm; not ours to lint or annotate.
exclude = ["src/tool_eval_bench/_version\\.py"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tool_eval_bench.cli.plugin_runners"
disable_error_code = ["import-not-found"]


[project.scripts]
tool-eval-bench = "tool_eval_bench.cli.bench:main"

[project.urls]
Homepage = "https://github.com/SeraphimSerapis/tool-eval-bench"
Repository = "https://github.com/SeraphimSerapis/tool-eval-bench"
Documentation = "https://github.com/SeraphimSerapis/tool-eval-bench#readme"
Issues = "https://github.com/SeraphimSerapis/tool-eval-bench/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
tool_eval_bench = ["evals/yaml_scenarios/*.yaml", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/tool_eval_bench/_version.py"
# Building outside a git checkout (sdist, shallow clone) still has to work; the
# "+unknown" local segment makes such a build obviously unattributable rather
# than silently claiming to be a release.
fallback_version = "0.0.0+unknown"

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff 0.16+ formats Python fenced blocks in Markdown by default. Keep docs
# examples human-edited (aligned comments, intentional layout) and avoid CI
# breakage when the unbound `ruff>=0.12` pin floats across major formatter changes.
extend-exclude = ["*.md", "src/tool_eval_bench/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "S"]
ignore = [
    "E501",   # Line too long — 500+ pre-existing violations; enforced gradually
    "S105",   # Hardcoded password — false positives on enum values / env flags
    "S311",   # Pseudo-random generators — used for reproducible benchmarking, not crypto
    "S310",   # URL audit — URLs come from user-provided CLI args
    "S607",   # Partial executable path — intentional (`git`)
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert statements extensively — suppress S101
"tests/**" = ["S101", "S108"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
  "live: requires a live external service or inference endpoint",
  "slow: takes materially longer than the default unit-test suite",
  "integration: exercises multiple project layers together",
]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore:unclosed event loop:ResourceWarning",
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/tool_eval_bench/runner/llama_benchy.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
